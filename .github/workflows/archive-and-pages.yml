name: Autonomous Research Archiver & Knowledge Sync

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-and-sync:
    name: Sync WordPress Research Articles to Markdown Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Ingest & Convert Articles
        run: |
          python scripts/archive_sync.py

      - name: Commit & Push Archived Markdown
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/
          git diff --staged --quiet || (git commit -m "chore(archive): sync latest research dossiers & canonical tags" && git push)
